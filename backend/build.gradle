plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.notebloom'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 把前端 build 結果（frontend/dist）一起包進 JAR，由 Spring Boot 內嵌 Tomcat 當靜態檔提供。
// bootJar 會自動先跑 npm ci + npm run build；加 -PskipFrontend 則只打包後端（Docker image 用）。
def frontendDir = file('../frontend')
def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
    workingDir = frontendDir
    commandLine npm, 'ci'
    inputs.file("${frontendDir}/package-lock.json")
    outputs.dir("${frontendDir}/node_modules")
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'npmInstall'
    workingDir = frontendDir
    commandLine npm, 'run', 'build'
    inputs.dir("${frontendDir}/src")
    inputs.dir("${frontendDir}/public")
    inputs.files("${frontendDir}/index.html", "${frontendDir}/package.json", "${frontendDir}/vite.config.ts")
    outputs.dir("${frontendDir}/dist")
}

if (!project.hasProperty('skipFrontend')) {
    tasks.named('bootJar') {
        dependsOn 'buildFrontend'
        from("${frontendDir}/dist") {
            into 'BOOT-INF/classes/static'
        }
    }
}
