spring:
  application:
    name: notebloom-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notebloom?currentSchema=notebloom}
    username: ${DB_USERNAME:notebloom}
    password: ${DB_PASSWORD:notebloom}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # Images inserted into notes; keep in sync with MAX_IMAGE_BYTES in frontend/src/api/imagesApi.ts
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  # Trust X-Forwarded-* from a local proxy (cloudflared), so https://funtoo.cc is seen as the real origin
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax

notebloom:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Activates the initial administrator on first start; remove after logging in (see AdminAccountInitializer)
  bootstrap:
    admin-username: ${NOTEBLOOM_BOOTSTRAP_ADMIN_USERNAME:}
    admin-display-name: ${NOTEBLOOM_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
    admin-password: ${NOTEBLOOM_BOOTSTRAP_ADMIN_PASSWORD:}
