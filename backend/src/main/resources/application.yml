spring:
  application:
    name: notebloom-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notebloom?currentSchema=notebloom}
    username: ${DB_USERNAME:notebloom}
    password: ${DB_PASSWORD:notebloom}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

notebloom:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
