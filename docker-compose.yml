services:
  postgres:
    image: postgres:16-alpine
    container_name: notebloom-postgres
    environment:
      POSTGRES_DB: notebloom
      POSTGRES_USER: notebloom
      POSTGRES_PASSWORD: notebloom
    ports:
      - "5432:5432"
    volumes:
      - notebloom-postgres-data:/var/lib/postgresql/data

volumes:
  notebloom-postgres-data:
